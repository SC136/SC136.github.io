        [data-theme="dark"] {
            color-scheme: dark;
            --primary: #ffb4a1; --on-primary: #561f10; --primary-container: #723524; --on-primary-container: #ffdbd2;
            --surface: #1a110f; --surface-high: #322825; --on-surface: #f1dfda; --on-surface-variant: #d8c2bc;
        }
        [data-theme="light"] {
            color-scheme: light;
            --primary: #8f4c3b; --on-primary: #ffffff; --primary-container: #ffdbd2; --on-primary-container: #723524;
            --surface: #fff8f6; --surface-high: #f1dfda; --on-surface: #231917; --on-surface-variant: #53433f;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            display: grid;
            place-items: center;
            margin: 0;
            padding: 24px 16px;
            background: radial-gradient(ellipse 80% 60% at 50% 0%, color-mix(in oklab, var(--primary-container) 55%, transparent), transparent 70%), var(--surface);
            color: var(--on-surface);
            font-family: "Google Sans Flex", system-ui, sans-serif;
            text-align: center;
        }
        .ms { font-family: "Material Symbols Rounded"; font-size: 20px; line-height: 1; font-feature-settings: "liga"; }
        main { display: flex; flex-direction: column; align-items: center; max-width: 520px; }
        .stage { position: relative; display: grid; place-items: center; width: min(320px, 78vw); aspect-ratio: 1; margin-bottom: 8px; }
        .shape {
            position: absolute;
            inset: 0;
            background: var(--primary-container);
            clip-path: var(--shape-cookie12);
            animation: turn 40s linear infinite;
            transition: clip-path 0.8s var(--spring);
        }
        .stage:hover .shape { clip-path: var(--shape-flower8); }
        @keyframes turn { to { rotate: 360deg; } }
        .code {
            position: relative;
            font-size: clamp(5rem, 22vw, 8.5rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1;
            color: var(--on-primary-container);
        }
        .sticker {
            position: absolute;
            right: -14%;
            bottom: -10%;
            width: 46%;
            height: auto;
            aspect-ratio: 1;
            object-fit: contain;
            rotate: 8deg;
            filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35));
            animation: drop-in 0.7s var(--spring) both 0.15s;
            cursor: pointer;
        }
        @keyframes drop-in { from { opacity: 0; translate: 0 -40px; scale: 0.6; } }
        h1 { margin: 24px 0 8px; font-size: 1.6rem; font-weight: 500; }
        p { margin: 0 0 24px; color: var(--on-surface-variant); line-height: 1.5; }
        p code { padding: 2px 8px; border-radius: 8px; background: var(--surface-high); font-size: 0.9em; }
        .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 44px;
            padding: 0 20px 0 16px;
            border-radius: 999px;
            background: var(--surface-high);
            color: var(--on-surface);
            font-weight: 500;
            text-decoration: none;
            transition: border-radius 0.3s var(--ease);
        }
        .btn:hover { border-radius: 14px; }
        .btn.filled { background: var(--primary); color: var(--on-primary); }
        .btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) { .shape, .sticker { animation: none; } }

<body>
<main>
    <div class="stage">
        <div class="shape" aria-hidden="true"></div>
        <span class="code" aria-hidden="true">404</span>
        <img class="sticker" id="sticker" alt="" width="200" height="200">
    </div>
    <h1 id="line">this page isn't here</h1>
    <p>nothing lives at <code id="path">this address</code>, or it moved.</p>
    <div class="actions">
        <a class="btn filled" href="/"><span class="ms">home</span>back home</a>
        <a class="btn" href="/old/"><span class="ms">history</span>the old site</a>
        <a class="btn" href="https://swar.is-a.dev/"><span class="ms">arrow_outward</span>my portfolio</a>
    </div>
</main>
<script>
    // A different sticker, and its own excuse, on every visit (tap it for another)
    (function () {
        var lost = [
            ['/assets/stickers/gojo.webp', 'not even the six eyes can find this page'],
            ['/assets/stickers/turbo-granny.webp', 'turbo granny ran off with this page'],
            ['/assets/stickers/eva-01.webp', 'this page went berserk and left'],
            ['https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/717.png', 'yveltal got to this page first'],
        ];
        var i = Math.floor(Math.random() * lost.length);
        var img = document.getElementById('sticker'), line = document.getElementById('line');
        function show() { img.src = lost[i][0]; line.textContent = lost[i][1]; }
        show();
        img.addEventListener('click', function () { i = (i + 1) % lost.length; show(); });
        var path = decodeURIComponent(location.pathname);
        if (path && path !== '/404.html') document.getElementById('path').textContent = path;
    })();
</script>
